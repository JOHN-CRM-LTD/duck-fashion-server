name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Install, seed, boot and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify customer matching, migration, bonus seeding and public photo URLs
        run: node --import tsx --test server/customer-directory.test.ts server/bonus-seed.test.ts server/member-verification.test.ts server/manager-directory.test.ts server/capsule-store.test.ts

      - name: Seed the demo database
        run: npm run seed

      - name: Generate throwaway connection keys
        run: bash deploy/create-config.sh https://duck-fashion-ci.invalid

      - name: Boot the API and run endpoint checks
        run: bash deploy/smoke-test.sh
